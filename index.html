<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Light Mobile Detailing</title>
  <!-- Favicon fix -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3078/3078048.png" type="image/png">
  <style>
    /* ... (your existing CSS unchanged) ... */
    /* Add this for better label accessibility */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  </style>
</head>
<body>
  <!-- ... (header, hero, services, gallery unchanged) ... -->

  <section class="section" id="booking">
    <h2>Book a Detail</h2>
    <div class="booking-card reveal gloss">
      <p style="margin-bottom:10px;color:#03314d">
        Request a booking below. Final pricing is based on vehicle size and condition.
      </p>
      <form id="bookingForm">
        <div class="field">
          <label for="fullName" class="sr-only">Full Name (required)</label>
          <input type="text" id="fullName" name="fullName" placeholder="Full name" required />
          <label for="phone" class="sr-only">Phone (required)</label>
          <input type="tel" id="phone" name="phone" placeholder="Phone" required />
        </div>
        <div class="field">
          <label for="email" class="sr-only">Email (required)</label>
          <input type="email" id="email" name="email" placeholder="Email" required />
          <label for="service" class="sr-only">Requested service</label>
          <input type="text" id="service" name="service" placeholder="Requested service" />
        </div>
        <div class="field">
          <label for="date" class="sr-only">Preferred date</label>
          <input type="date" id="date" name="date" />
          <label for="time" class="sr-only">Preferred time</label>
          <input type="time" id="time" name="time" />
        </div>
        <label for="notes" class="sr-only">Vehicle details, location, notes</label>
        <textarea id="notes" name="notes" placeholder="Vehicle details, location, notes" rows="3" style="width:100%;margin-bottom:10px;"></textarea>
        <div style="text-align:center">
          <button type="submit" style="background:var(--aqua);border:none;padding:10px 18px;border-radius:8px;color:white;font-weight:700;cursor:pointer">
            Request Booking
          </button>
        </div>
      </form>
      <p style="margin-top:8px;color:#06324d;opacity:.9;font-size:.92rem">
        You’ll receive a confirmation after details are reviewed.
      </p>
    </div>
  </section>

  <!-- ... (about, contact, footer unchanged) ... -->

  <script>
    // ... (existing observer and form submit unchanged) ...
  </script>
</body>
</html>
